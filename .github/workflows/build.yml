name: build-apk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Name APK with version
        id: ver
        run: |
          V=$(grep -oE 'versionName = "[0-9.]+"' app/build.gradle.kts | grep -oE '[0-9.]+' | head -1)
          NAME="Quillpad_v${V}.apk"
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          echo "ver=$V" >> "$GITHUB_OUTPUT"
      - name: Publish to 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.ver.outputs.apk }}" \
            --title "Quillpad (fork) v${{ steps.ver.outputs.ver }}" \
            --notes "Skini ${{ steps.ver.outputs.apk }} ispod, otvori na telefonu i instaliraj."
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.apk }}
          path: ${{ steps.ver.outputs.apk }}
          if-no-files-found: error
